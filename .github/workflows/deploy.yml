# En cada push a main: compila la imagen en GitHub y la publica en GHCR; después el runner
# de talampaya la descarga y reinicia solo el frontend. En los PR a main solo se verifica que compile.
# El stack (docker-compose.yml y .env) lo instala el deploy del repo atlas-backend.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-atlas-frontend-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/areadesarrollosffha-maxi/atlas-frontend
  # URL pública del sitio, se incrusta en el bundle. Variable del repo PUBLIC_URL.
  PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://atlas.ffha.unsj.edu.ar' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            VITE_API_URL=${{ env.PUBLIC_URL }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, talampaya]
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/atlas' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Pull and restart
        run: |
          set -eu
          if [ ! -f "$DEPLOY_DIR/docker-compose.yml" ] || [ ! -f "$DEPLOY_DIR/.env" ]; then
            echo "::error::No existe el stack en $DEPLOY_DIR. Corré primero el deploy de atlas-backend."
            exit 1
          fi
          cd "$DEPLOY_DIR"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker compose pull frontend
          docker compose up -d --no-deps frontend
          docker logout ghcr.io
          docker image prune -f
          docker compose ps frontend
