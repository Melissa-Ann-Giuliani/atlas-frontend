# Detrás de nginx-proxy llegan X-Forwarded-Proto/Host; si se entra directo (IP:puerto) se usan los propios.
# El backend los usa (server.forward-headers-strategy=framework) para reconocer los pedidos del mismo origen.
map $http_x_forwarded_proto $atlas_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}
map $http_x_forwarded_host $atlas_host {
  default $http_x_forwarded_host;
  ""      $http_host;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 10m;

  # API: el backend corre en el mismo stack (servicio "backend").
  # El nombre se resuelve en cada request, así nginx arranca aunque el backend no exista.
  location /api/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend http://backend:8081;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $atlas_proto;
    proxy_set_header X-Forwarded-Host $atlas_host;
    proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
    proxy_read_timeout 60s;
  }

  # PWA: el service worker y el manifest nunca se cachean, así las versiones nuevas llegan solas.
  location ~* ^/(sw\.js|registerSW\.js|workbox-.*\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
  }

  # Assets con hash de Vite: cacheables a largo plazo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: las rutas (/listado, /gestion, ...) se resuelven en el cliente.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
